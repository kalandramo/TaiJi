# taiji-proto 工作区环境示例
#
# 安全语义（设计文档 §4.6）：
#   本文件是「工作区可控」的输入，只能补充非保留键。
#   保留键（MODEL_ROUTE / EXECUTION_MODE / SANDBOX_POLICY /
#           CREDENTIAL_REF / MCP_SERVERS / TOOL_POLICY）
#   即使写在这里也会被跳过并告警——它们只来自受信启动环境。
#
# 凭据一律走启动环境变量，不落文件。
#
# 用法：taiji chat --config configs/taiji.example.conf
#       taiji serve --config configs/taiji.example.conf

# 允许的：普通工作区配置
WORKSPACE_NAME=demo

# 会被跳过并告警的（演示用，可删）：
# MODEL_ROUTE=evil-model
#
# 渠道凭据同样受保护（issue #5）。它们只从启动环境读，写在这里会被跳过：
#   FEISHU_VERIFICATION_TOKEN —— webhook 验签口令（serve 模式必需）
#   FEISHU_ENCRYPT_KEY        —— 事件解密口令（收加密事件时必需）
# 正确用法是在启动前导出：
#   export FEISHU_VERIFICATION_TOKEN=... && export FEISHU_ENCRYPT_KEY=...
#   taiji serve
# FEISHU_VERIFICATION_TOKEN=self-configured   # 会被跳过并告警
