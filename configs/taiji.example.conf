# taiji 工作区环境示例
#
# 安全语义（设计文档 §4.6）：
#   本文件是「工作区可控」的输入，只能补充**非保留键**。
#   保留键即使写在这里也会被跳过并告警——它们只来自受信启动环境。
#
# **凭据一律走环境变量，不落文件**（硬约束）。
#
# 用法：taiji chat --config configs/taiji.example.conf
#       taiji serve --config configs/taiji.example.conf
#
# 完整环境变量清单见 docs/13-环境变量清单.md
# 本地部署指引见   docs/15-Windows本地开发部署.md

# ── 目前唯一有生产用途的工作区键 ──
#
# WORKSPACE_NAME 是 workspaceID() 的第二优先级回退
# （cmd/taiji/main.go:799）：TAIJI_WORKSPACE_ID 环境变量 > 本文件 > "default"。
#
# workspaceID 决定：串行化域、会话路由前缀、RBAC 主体 ID 的 workspace 段。
# 即 —— 改它会让**主体 ID 跟着变**（default:feishu:xxx → myws:feishu:xxx），
# 已配好的 TAIJI_RBAC 用户条目会失配。改这个值前先想清楚。
WORKSPACE_NAME=demo

# ── 另两个被读取的工作区键（模型配置覆盖）──
#
# modelCfg 会从本文件读这两个键覆盖环境变量（cmd/taiji/main.go:130,133 与 :436,439）：
#   TAIJI_MODEL_NAME      —— 注意：它同时是 ReservedKeys 成员
#   TAIJI_MODEL_BASE_URL
#
# 但 TAIJI_MODEL_NAME 在保留集合里，写在这里会被跳过——所以实际只有
# TAIJI_MODEL_BASE_URL 可通过本文件覆盖。这是保护基线的一部分，不是遗漏。
# TAIJI_MODEL_BASE_URL=https://api.example.com/v1

# ── 会被跳过并告警的（演示用，可删）──
#
# 保留键（internal/config/guard.go 的 ReservedKeys）——写了也不生效：
#   TAIJI_INSTRUCTION / TAIJI_SKILLS_ROOT / TAIJI_SKILL_TOOL_PROFILE / TAIJI_AGENTS
#   （以及历史遗留的 MODEL_ROUTE / EXECUTION_MODE / SANDBOX_POLICY /
#     CREDENTIAL_REF / MCP_SERVERS / TOOL_POLICY —— 保留作为保护基线）
#
# 凭据键（CredentialKeys）——同理：
#   FEISHU_APP_ID / FEISHU_APP_SECRET
#   FEISHU_VERIFICATION_TOKEN / FEISHU_ENCRYPT_KEY（webhook 形态遗留，当前无读取方，
#     但保留在保护集合里，以免将来重加 webhook 时失去保护基线）
#
# 前缀族（ReservedPrefixes）：
#   TAIJI_MCP_HEADERS_*
#
# 正确用法是在**启动环境**里设置（PowerShell）：
#   $env:FEISHU_APP_ID     = "cli_xxxxxxxxxxxx"
#   $env:FEISHU_APP_SECRET = "xxxxxxxxxxxxxxxx"
#   .\taiji.exe serve --feishu-mode=longconn
#
# 下面这行是反例——它会被跳过并打印告警：
# FEISHU_APP_ID=self-configured
