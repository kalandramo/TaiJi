# taiji-proto 工作区环境示例
#
# 安全语义（设计文档 §4.6）：
#   本文件是「工作区可控」的输入，只能补充非保留键。
#   保留键（MODEL_ROUTE / EXECUTION_MODE / SANDBOX_POLICY /
#           CREDENTIAL_REF / MCP_SERVERS / TOOL_POLICY）
#   即使写在这里也会被跳过并告警——它们只来自受信启动环境。
#
# 凭据一律走启动环境变量，不落文件。
#
# 用法：taiji chat --config configs/taiji.example.conf

# 允许的：普通工作区配置
WORKSPACE_NAME=demo

# 会被跳过并告警的（演示用，可删）：
# MODEL_ROUTE=evil-model
